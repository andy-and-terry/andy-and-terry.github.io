<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Game Library</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<nav class="site-nav">
  <a href="index.html" class="active">Home</a>
  <a href="#" aria-disabled="true" title="Coming soon">Categories</a>
</nav>

<header class="site-header">
  <h1>🎮 Game Library</h1>
  <p class="subtitle">Browser-based games. Everything runs locally in your tab — no accounts, no server.</p>
</header>

<main>
  <div id="game-grid" class="game-grid"></div>
</main>

<footer class="page-footer">Runs locally in your browser.</footer>

<script>
  // Fetch the game list and render one card per entry, no manual HTML per game.
  fetch("games.json")
    .then((res) => res.json())
    .then((games) => {
      const grid = document.getElementById("game-grid");
      games.forEach((game) => {
        const card = document.createElement("a");
        card.className = "game-card";
        card.href = `${game.id}/index.html`;
        card.innerHTML = `
          <span class="thumb">${game.thumbnail}</span>
          <div class="name">${game.title}</div>
          <div class="desc">${game.description}</div>
          <div class="play">Play →</div>
        `;
        grid.appendChild(card);
      });
    })
    .catch((err) => console.error("Failed to load games.json", err));
</script>
</body>
</html>
