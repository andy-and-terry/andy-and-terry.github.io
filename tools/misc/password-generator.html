<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🧰 Misc Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
</header>

<main>
  <h1>Password Generator</h1>
  <p class="subtitle">
    Cryptographically random passwords, generated locally in your browser. Nothing is sent
    anywhere.
  </p>

  <div class="card">
    <h2>Options</h2>
    <div class="field">
      <label for="length-range">Length <span class="value-pill" id="length-value">16</span></label>
      <input type="range" id="length-range" min="4" max="128" step="1" value="16" />
    </div>

    <div class="check-grid">
      <label class="check"><input type="checkbox" id="chk-upper" checked /> Uppercase (A-Z)</label>
      <label class="check"><input type="checkbox" id="chk-lower" checked /> Lowercase (a-z)</label>
      <label class="check"><input type="checkbox" id="chk-digits" checked /> Numbers (0-9)</label>
      <label class="check"><input type="checkbox" id="chk-symbols" /> Symbols (!@#$…)</label>
    </div>
    <label class="check" style="margin-top:10px">
      <input type="checkbox" id="chk-ambiguous" />
      Exclude ambiguous characters (0 O o 1 l I |)
    </label>
    <div id="banner-slot"></div>
  </div>

  <div class="card">
    <h2>Password</h2>
    <div class="result-box">
      <div class="result-value" id="password-value" style="font-size:18px"></div>
      <button class="btn-small copy-btn" id="copy-btn">Copy</button>
    </div>
    <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
    <div class="meter-label">
      <span id="meter-text">—</span>
      <span id="entropy-text"></span>
    </div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn btn-primary" id="regenerate-btn">🔁 Regenerate</button>
    </div>
  </div>

  <div class="card">
    <h2>Bulk Generate</h2>
    <div class="field-row">
      <div class="field">
        <label for="bulk-count">Count</label>
        <input type="number" id="bulk-count" min="1" max="500" value="10" />
      </div>
      <div class="field" style="display:flex; align-items:flex-end;">
        <button class="btn btn-secondary" id="bulk-btn" style="width:100%">Generate List</button>
      </div>
    </div>
    <textarea id="bulk-output" rows="10" readonly placeholder="Generated passwords will appear here…"></textarea>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-secondary" id="bulk-copy-btn">📋 Copy All</button>
      <button class="btn btn-secondary" id="bulk-download-btn">⬇ Download .txt</button>
    </div>
  </div>
</main>

<footer class="page-footer">Runs locally in your browser. No files leave your device.</footer>

<script src="nav.js"></script>
<script>
(function () {
  var CHARSETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    digits: "0123456789",
    symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?",
  };
  var AMBIGUOUS = /[0Oo1lI|]/;

  var lengthRange = document.getElementById("length-range");
  var lengthValue = document.getElementById("length-value");
  var chkUpper = document.getElementById("chk-upper");
  var chkLower = document.getElementById("chk-lower");
  var chkDigits = document.getElementById("chk-digits");
  var chkSymbols = document.getElementById("chk-symbols");
  var chkAmbiguous = document.getElementById("chk-ambiguous");
  var bannerSlot = document.getElementById("banner-slot");
  var passwordValue = document.getElementById("password-value");
  var copyBtn = document.getElementById("copy-btn");
  var regenerateBtn = document.getElementById("regenerate-btn");
  var meterFill = document.getElementById("meter-fill");
  var meterText = document.getElementById("meter-text");
  var entropyText = document.getElementById("entropy-text");
  var bulkCount = document.getElementById("bulk-count");
  var bulkBtn = document.getElementById("bulk-btn");
  var bulkOutput = document.getElementById("bulk-output");
  var bulkCopyBtn = document.getElementById("bulk-copy-btn");
  var bulkDownloadBtn = document.getElementById("bulk-download-btn");

  function showBanner(message, kind) {
    if (!message) {
      bannerSlot.innerHTML = "";
      return;
    }
    bannerSlot.innerHTML = '<div class="banner banner-' + kind + '">' + message + "</div>";
  }

  function activeSets() {
    var sets = [];
    if (chkUpper.checked) sets.push(CHARSETS.upper);
    if (chkLower.checked) sets.push(CHARSETS.lower);
    if (chkDigits.checked) sets.push(CHARSETS.digits);
    if (chkSymbols.checked) sets.push(CHARSETS.symbols);
    if (chkAmbiguous.checked) {
      sets = sets.map(function (s) {
        return s.replace(AMBIGUOUS, "").split("").filter(function (c) {
          return !AMBIGUOUS.test(c);
        }).join("");
      });
    }
    return sets.filter(function (s) {
      return s.length > 0;
    });
  }

  function randomInt(max) {
    var arr = new Uint32Array(1);
    var limit = Math.floor(0xffffffff / max) * max;
    var val;
    do {
      crypto.getRandomValues(arr);
      val = arr[0];
    } while (val >= limit);
    return val % max;
  }

  function pickRandomChar(str) {
    return str[randomInt(str.length)];
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = randomInt(i + 1);
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function generatePassword(length, sets) {
    var pool = sets.join("");
    var chars = [];
    for (var i = 0; i < length; i++) {
      chars.push(pickRandomChar(pool));
    }
    if (sets.length <= length) {
      sets.forEach(function (set, idx) {
        chars[idx] = pickRandomChar(set);
      });
      shuffle(chars);
    }
    return chars.join("");
  }

  function entropyBits(length, poolSize) {
    return length * Math.log2(poolSize);
  }

  function updateMeter(bits) {
    var pct = Math.min(100, (bits / 128) * 100);
    meterFill.style.width = pct + "%";
    var label, color;
    if (bits < 28) {
      label = "Very Weak";
      color = "var(--error)";
    } else if (bits < 45) {
      label = "Weak";
      color = "var(--error)";
    } else if (bits < 60) {
      label = "Fair";
      color = "var(--warning)";
    } else if (bits < 80) {
      label = "Good";
      color = "var(--success)";
    } else {
      label = "Very Strong";
      color = "var(--success)";
    }
    meterFill.style.background = color;
    meterText.textContent = label;
    entropyText.textContent = Math.round(bits) + " bits of entropy";
  }

  function render() {
    var length = parseInt(lengthRange.value, 10);
    lengthValue.textContent = length;

    var sets = activeSets();
    if (sets.length === 0) {
      showBanner("Select at least one character type.", "warning");
      passwordValue.textContent = "";
      copyBtn.disabled = true;
      regenerateBtn.disabled = true;
      meterFill.style.width = "0%";
      meterText.textContent = "—";
      entropyText.textContent = "";
      return;
    }

    showBanner("", "");
    copyBtn.disabled = false;
    regenerateBtn.disabled = false;

    var password = generatePassword(length, sets);
    passwordValue.textContent = password;

    var poolSize = sets.join("").length;
    updateMeter(entropyBits(length, poolSize));
  }

  [lengthRange].forEach(function (el) {
    el.addEventListener("input", render);
  });
  [chkUpper, chkLower, chkDigits, chkSymbols, chkAmbiguous].forEach(function (el) {
    el.addEventListener("change", render);
  });
  regenerateBtn.addEventListener("click", render);

  copyBtn.addEventListener("click", function () {
    var text = passwordValue.textContent;
    if (!text || !navigator.clipboard) return;
    navigator.clipboard.writeText(text).then(function () {
      showBanner("Copied to clipboard.", "success");
    });
  });

  bulkBtn.addEventListener("click", function () {
    var sets = activeSets();
    if (sets.length === 0) {
      showBanner("Select at least one character type.", "warning");
      return;
    }
    var length = parseInt(lengthRange.value, 10);
    var count = parseInt(bulkCount.value, 10);
    if (isNaN(count) || count < 1) count = 1;
    if (count > 500) count = 500;
    bulkCount.value = count;

    var lines = [];
    for (var i = 0; i < count; i++) {
      lines.push(generatePassword(length, sets));
    }
    bulkOutput.value = lines.join("\n");
  });

  bulkCopyBtn.addEventListener("click", function () {
    if (!bulkOutput.value || !navigator.clipboard) return;
    navigator.clipboard.writeText(bulkOutput.value).then(function () {
      showBanner("Copied all passwords to clipboard.", "success");
    });
  });

  bulkDownloadBtn.addEventListener("click", function () {
    if (!bulkOutput.value) return;
    var blob = new Blob([bulkOutput.value], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "passwords.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 1000);
  });

  render();
})();
</script>
</body>
</html>
