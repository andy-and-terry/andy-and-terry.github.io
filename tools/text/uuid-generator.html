<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>UUID Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🧰 Text Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
  <a href="../index.html" style="color:var(--text-faint);font-size:13px;white-space:nowrap">← All Toolkits</a>
</header>

<main>
  <h1>UUID Generator</h1>
  <p class="subtitle">Generate cryptographically random v4 UUIDs using <code>crypto.getRandomValues</code>. Runs entirely in your browser.</p>

  <div class="card">
    <div class="field-row">
      <div class="field" style="max-width:160px">
        <label for="count">Count</label>
        <input type="number" id="count" value="5" min="1" max="1000" />
      </div>
      <div class="field" style="max-width:200px">
        <label for="case-select">Case</label>
        <select id="case-select">
          <option value="lower" selected>lowercase</option>
          <option value="upper">UPPERCASE</option>
        </select>
      </div>
      <div class="field" style="display:flex;align-items:flex-end">
        <label style="display:flex;align-items:center;gap:6px;margin:0 0 9px">
          <input type="checkbox" id="hyphens" checked /> Include hyphens
        </label>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="generate-btn" type="button">Generate</button>
      <button class="copy-btn" id="copy-all-btn" type="button">Copy all</button>
    </div>
  </div>

  <div class="card">
    <h2>Generated</h2>
    <div class="uuid-list" id="uuid-list"></div>
  </div>
</main>

<footer class="page-footer">Runs entirely in your browser. Nothing is sent anywhere.</footer>

<script src="nav.js"></script>
<script src="js/common.js"></script>
<script src="js/uuid-generator.js"></script>
</body>
</html>
