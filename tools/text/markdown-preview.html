<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown Preview</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🧰 Text Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
  <a href="../index.html" style="color:var(--text-faint);font-size:13px;white-space:nowrap">← All Toolkits</a>
</header>

<main>
  <h1>Markdown Preview</h1>
  <p class="subtitle">Live markdown-to-HTML preview with a small vanilla-JS renderer. Output is escaped, so raw HTML in your source is shown as text, not executed.</p>

  <div class="card">
    <div class="field-label-row">
      <h2 style="margin:0">Markdown</h2>
      <button class="btn btn-secondary" id="sample-btn" type="button">Load sample</button>
    </div>
    <textarea id="input" rows="16" spellcheck="false" placeholder="# Heading&#10;&#10;Some **bold** and _italic_ text with `inline code`."></textarea>
  </div>

  <div class="card">
    <h2>Preview</h2>
    <div class="md-preview" id="preview"></div>
  </div>
</main>

<footer class="page-footer">Runs entirely in your browser. Nothing you type is sent anywhere.</footer>

<script src="nav.js"></script>
<script src="js/common.js"></script>
<script src="js/markdown-preview.js"></script>
</body>
</html>
