<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lorem Ipsum Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🧰 Text Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
  <a href="../index.html" style="color:var(--text-faint);font-size:13px;white-space:nowrap">← All Toolkits</a>
</header>

<main>
  <h1>Lorem Ipsum Generator</h1>
  <p class="subtitle">Generate placeholder text by paragraphs, sentences, or words. Runs entirely in your browser.</p>

  <div class="card">
    <div class="field-row">
      <div class="field" style="max-width:180px">
        <label for="unit">Generate by</label>
        <select id="unit">
          <option value="paragraphs" selected>Paragraphs</option>
          <option value="sentences">Sentences</option>
          <option value="words">Words</option>
        </select>
      </div>
      <div class="field" style="max-width:140px">
        <label for="count">Count</label>
        <input type="number" id="count" value="4" min="1" max="200" />
      </div>
      <div class="field" style="max-width:220px">
        <label for="wordbank">Word bank</label>
        <select id="wordbank">
          <option value="classic" selected>Classic Latin</option>
          <option value="tech">Tech / startup buzzwords</option>
          <option value="corporate">Corporate buzzwords</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label style="display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="classic-start" checked /> Start with "Lorem ipsum dolor sit amet..."
      </label>
    </div>
  </div>

  <div class="card">
    <div class="field-label-row">
      <h2 style="margin:0">Output</h2>
      <button class="copy-btn" id="copy-btn" type="button">Copy</button>
    </div>
    <div class="output-box" id="output"></div>
  </div>
</main>

<footer class="page-footer">Runs entirely in your browser. Nothing is sent anywhere.</footer>

<script src="nav.js"></script>
<script src="js/common.js"></script>
<script src="js/lorem-ipsum.js"></script>
</body>
</html>
