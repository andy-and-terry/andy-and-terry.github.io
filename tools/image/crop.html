<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crop Image — Image Toolkit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🖼️ Image Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
</header>

<main>
  <h1>Crop Image</h1>
  <p class="subtitle">Drag the box to reposition, drag the corner to resize, then crop to just that region.</p>

  <div class="card">
    <h2>1. Choose an image</h2>
    <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Choose an image file">
      <div><strong>Click to choose</strong> or drag an image here</div>
      <input type="file" id="file-input" accept="image/*" hidden />
    </div>
    <div class="file-info" id="file-info" style="display:none">
      <span id="file-name"></span>
      <span id="file-size"></span>
    </div>
    <div id="load-error"></div>
    <div class="crop-stage" id="crop-stage" style="display:none">
      <img id="preview" alt="Preview" />
      <div class="crop-box" id="crop-box">
        <div class="crop-handle" id="crop-handle"></div>
      </div>
    </div>
  </div>

  <div class="card" id="controls-card" style="display:none">
    <h2>2. Crop region</h2>
    <div class="hint" id="crop-dims" style="margin-bottom:14px"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="process-btn" type="button">Crop image</button>
    </div>
    <div class="status-line" id="status-line"></div>
    <div id="error-banner"></div>
  </div>

  <div class="card output-card" id="output-card">
    <h2>3. Result</h2>
    <img class="preview" id="after-preview" alt="Cropped preview" />
    <div class="file-info"><span id="after-size"></span></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="download-link" download>Download</a>
    </div>
  </div>
</main>

<footer class="page-footer">Runs locally in your browser. No files leave your device.</footer>

<script src="js/common.js"></script>
<script src="nav.js"></script>
<script src="js/crop.js"></script>
</body>
</html>
