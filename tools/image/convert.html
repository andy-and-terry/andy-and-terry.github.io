<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Convert Image — Image Toolkit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🖼️ Image Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
</header>

<main>
  <h1>Convert Image</h1>
  <p class="subtitle">Convert between HEIC, WebP, PNG, and JPG. Runs locally in your browser.</p>

  <div class="card">
    <h2>1. Choose an image</h2>
    <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Choose an image file">
      <div><strong>Click to choose</strong> or drag an image here (incl. .heic/.heif)</div>
      <input type="file" id="file-input" accept="image/*,.heic,.heif" hidden />
    </div>
    <div class="file-info" id="file-info" style="display:none">
      <span id="file-name"></span>
      <span id="file-size"></span>
    </div>
    <img class="preview" id="preview" style="display:none" alt="Original preview" />
    <div id="load-error"></div>
    <div class="status-line" id="load-status"></div>
  </div>

  <div class="card" id="controls-card" style="display:none">
    <h2>2. Convert to</h2>
    <div class="field">
      <label>Output format</label>
      <select id="format-select">
        <option value="image/jpeg">JPG</option>
        <option value="image/png">PNG</option>
        <option value="image/webp">WebP</option>
      </select>
    </div>
    <div class="field" id="quality-field">
      <label>Quality — <span class="value-pill" id="quality-value">85</span></label>
      <input type="range" id="quality-input" min="1" max="100" value="85" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="process-btn" type="button">Convert</button>
    </div>
    <div class="status-line" id="status-line"></div>
    <div id="error-banner"></div>
  </div>

  <div class="card output-card" id="output-card">
    <h2>3. Result</h2>
    <img class="preview" id="after-preview" alt="Converted preview" />
    <div class="file-info"><span id="after-size"></span></div>
    <div class="btn-row">
      <a class="btn btn-primary" id="download-link" download>Download</a>
    </div>
  </div>
</main>

<footer class="page-footer">Runs locally in your browser. No files leave your device.</footer>

<script src="lib/heic2any.min.js"></script>
<script src="js/common.js"></script>
<script src="nav.js"></script>
<script src="js/convert.js"></script>
</body>
</html>
