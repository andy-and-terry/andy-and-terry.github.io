<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resize / Compress Image — Image Toolkit</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">🖼️ Image Toolkit</a>
  <nav class="tool-nav" id="tool-nav"></nav>
</header>

<main>
  <h1>Resize / Compress Image</h1>
  <p class="subtitle">Scale an image down and/or lower its quality to shrink file size. Everything happens in your browser.</p>

  <div class="card">
    <h2>1. Choose an image</h2>
    <div class="drop-zone" id="drop-zone" tabindex="0" role="button" aria-label="Choose an image file">
      <div><strong>Click to choose</strong> or drag an image here</div>
      <input type="file" id="file-input" accept="image/*" hidden />
    </div>
    <div class="file-info" id="file-info" style="display:none">
      <span id="file-name"></span>
      <span id="file-size"></span>
    </div>
    <img class="preview" id="preview" style="display:none" alt="Original preview" />
    <div id="load-error"></div>
  </div>

  <div class="card" id="controls-card" style="display:none">
    <h2>2. Settings</h2>
    <div class="field-row">
      <div class="field">
        <label>Width (px)</label>
        <input type="number" id="width-input" min="1" />
      </div>
      <div class="field">
        <label>Height (px)</label>
        <input type="number" id="height-input" min="1" />
      </div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="lock-aspect" checked /> Lock aspect ratio</label>
    </div>
    <div class="field">
      <label>Output format</label>
      <select id="format-select">
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
        <option value="image/png">PNG</option>
      </select>
    </div>
    <div class="field" id="quality-field">
      <label>Quality — <span class="value-pill" id="quality-value">80</span></label>
      <input type="range" id="quality-input" min="1" max="100" value="80" />
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="process-btn" type="button">Resize &amp; compress</button>
      <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
    </div>
    <div class="status-line" id="status-line"></div>
    <div id="error-banner"></div>
  </div>

  <div class="card output-card" id="output-card">
    <h2>3. Result</h2>
    <div class="field-row">
      <div class="field" style="flex:1">
        <label>Before</label>
        <img class="preview" id="before-preview" alt="Before" />
        <div class="hint" id="before-size"></div>
      </div>
      <div class="field" style="flex:1">
        <label>After</label>
        <img class="preview" id="after-preview" alt="After" />
        <div class="hint" id="after-size"></div>
      </div>
    </div>
    <div class="btn-row">
      <a class="btn btn-primary" id="download-link" download>Download</a>
    </div>
  </div>
</main>

<footer class="page-footer">Runs locally in your browser. No files leave your device.</footer>

<script src="js/common.js"></script>
<script src="nav.js"></script>
<script src="js/resize-compress.js"></script>
</body>
</html>
